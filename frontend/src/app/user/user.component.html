<div class="user-container">
  <div id="map-user"></div>

  <section class="table-section">
    <div class="table-header">
      <h2>All Locations</h2>
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (input)="applyFilter($event)" placeholder="Name, category…">
      </mat-form-field>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="locations-table">

      <ng-container matColumnDef="fav">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let item">
          <mat-icon class="fav-icon" [class.fav-icon--active]="isFav(item.id)">
            {{ isFav(item.id) ? 'star' : 'star_border' }}
          </mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let item">{{ item.description }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let item">{{ item.category }}</td>
      </ng-container>

      <ng-container matColumnDef="lat">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Lat</th>
        <td mat-cell *matCellDef="let item" class="mono">{{ item.lat | number:'1.4-4' }}</td>
      </ng-container>

      <ng-container matColumnDef="lng">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Lng</th>
        <td mat-cell *matCellDef="let item" class="mono">{{ item.lng | number:'1.4-4' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No locations match your filter.</td>
      </tr>
    </table>
  </section>
</div>
