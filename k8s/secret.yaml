# Do NOT commit real values. Use SOPS, Sealed Secrets, or an external secrets operator.
# This file documents the expected secret shape only.
apiVersion: v1
kind: Secret
metadata:
  name: springboot-app-secrets
  namespace: apps
type: Opaque
stringData:
  # Keycloak OIDC — realm where springboot-app client lives and end-users authenticate
  KEYCLOAK_ISSUER_URI: "https://your-keycloak/realms/your-realm"
  KEYCLOAK_CLIENT_SECRET: "your-client-secret"

  # Keycloak Admin — realm where end-users are stored (may differ from auth realm)
  # Used by Browse Users feature. Can be same as auth realm if users are co-located.
  KEYCLOAK_SERVER_URL: "http://keycloak.keycloak.svc.cluster.local"
  KEYCLOAK_USERS_REALM: "your-users-realm"

  # Keycloak admin-cli credentials (master realm) for cross-realm user listing
  # Required only if KEYCLOAK_USERS_REALM differs from the auth realm
  KEYCLOAK_ADMIN_USERNAME: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "your-keycloak-admin-password"

  # MongoDB connection string
  MONGO_URI: "mongodb://user:pass@host:27017/app_db?authSource=admin"

  # Allowed CORS origins (comma-separated)
  CORS_ALLOWED_ORIGINS: "https://your-app-domain"
